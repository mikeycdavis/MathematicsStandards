# Everything not listed above applies at its catalog level. Those are the rules whose subject IS the
# framework: integrity.provenance-digest, integrity.rule-lifecycle-honest, integrity.no-self-serving-
# modification, evidence.labels, evidence.skipped-never-passed, and agent.explainable-findings.
#
# integrity.no-self-serving-modification is manual-review with assurance none, so it reports
# not-evaluated in every automated run. It is deliberately NOT attested here: an attestation that the
# authors did not weaken any standard for their own convenience, written by the authors, establishes
# nothing. It stands as not-evaluated, which is the honest state.
