# This repository's own policy — the framework applied to itself.
#
# WHY THIS FILE IS MOSTLY not-applicable, AND WHY THAT IS THE POINT.
#
# MathematicsStandards is the standards framework, not a mathematical research project. It has no
# claims ledger, no proof-assistant sources, and no open problem, so the rules that read those
# artifacts have no subject here. That is a claim about THIS PROJECT, not about the rules, and it
# stops being true the moment the repository gains the capability — which is why every declaration
# below carries a revisitWhen condition naming the event that would end it (Standard 1 R2).
#
# Declaring them not-applicable rather than deleting them, or lowering their level until they stop
# failing, is the mechanism the framework ships. Using it on ourselves is the only way to find out
# whether it is usable, and it is what makes the difference between "this rule has no subject here"
# and "this rule is inconvenient" a thing the repository has actually had to answer for.
#
# The rules that DO apply are the ones whose subject is the framework itself: the provenance
# digests, the rule lifecycle, the evidence labelling on our own findings, the never-report-a-skip-
# as-a-pass invariant, and the explainability of what we emit.

